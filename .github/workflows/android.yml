name: build-apk

# 什么时候触发：
#   1. 往 main / master 推送代码 —— 构建一个 APK（只在 Actions 里可取）
#   2. 推一个 v* 的 tag —— 构建并把 APK 挂到 Releases 页面
#   3. 在 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: 构建前端（产出 dist/）
        run: npm run build

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不再使用 android-actions/setup-android：
      # 该 action 已停更，在 Node 24 下不稳定，且每次都要重下 cmdline-tools。
      # ubuntu-latest 的 runner 镜像本身就预装了 Android SDK，直接用即可。
      - name: 确认 Android SDK 位置
        run: |
          set -e
          if [ -z "$ANDROID_HOME" ]; then
            for d in /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk; do
              if [ -d "$d" ]; then
                echo "ANDROID_HOME=$d" >> "$GITHUB_ENV"
                echo "ANDROID_SDK_ROOT=$d" >> "$GITHUB_ENV"
                export ANDROID_HOME="$d"
                export ANDROID_SDK_ROOT="$d"
                break
              fi
            done
          fi
          echo "ANDROID_HOME = ${ANDROID_HOME:-(空)}"
          echo "ANDROID_SDK_ROOT = ${ANDROID_SDK_ROOT:-(空)}"
          echo "--- 已装的 platforms ---"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "(无)"
          echo "--- 已装的 build-tools ---"
          ls "${ANDROID_HOME}/build-tools" 2>/dev/null || echo "(无)"
          echo "--- sdkmanager 位置 ---"
          command -v sdkmanager || ls "${ANDROID_HOME}/cmdline-tools" 2>/dev/null || echo "(找不到 sdkmanager)"

      - name: 补齐 Android SDK 组件
        run: |
          set +e
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(command -v sdkmanager)"
          fi
          echo "使用的 sdkmanager => ${SDKM}"
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "::warning::找不到 sdkmanager，跳过补齐，完全依赖 runner 预装组件"
            exit 0
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1
          for pkg in "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0"; do
            echo "==> 安装 ${pkg}"
            "$SDKM" --install "$pkg" 2>&1 | tail -2
          done
          echo "--- 补齐后 platforms ---"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "(无)"
          exit 0

      - name: 生成 Android 原生工程
        run: npx cap add android || true

      - name: 把 web 产物同步进原生工程
        run: npx cap sync android

      # 双保险：即使 @capacitor/keyboard 插件没生效，
      # 也让系统用 adjustResize（缩小窗口）而不是 adjustPan（整个画面上移）。
      # 否则键盘弹出时顶栏会被顶出屏幕。
      - name: 强制键盘调整模式为 adjustResize
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          if grep -q 'windowSoftInputMode' "$MF"; then
            echo "已有 windowSoftInputMode，跳过"
          else
            sed -i 's|<activity|<activity android:windowSoftInputMode="adjustResize"|' "$MF"
            echo "已写入 adjustResize"
          fi
          grep -n 'windowSoftInputMode' "$MF" || true

      - name: 给 gradlew 加执行权限
        # Windows 上提交的仓库到 Linux 常丢可执行位，这一步不做会直接 Permission denied
        run: chmod +x android/gradlew

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 写入 local.properties（告诉 Gradle SDK 在哪）
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      # 仓库里带了一个固定的签名证书 keystore/chatcell.p12。
      # 没有它的话，每次全新 runner 生成的 debug 签名都不同，导致新包无法覆盖安装旧包。
      - name: 准备签名密钥（p12 → JKS）
        run: |
          keytool -importkeystore \
            -srckeystore keystore/chatcell.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass 'chatcell2026' \
            -srcalias chatcell \
            -destkeystore "$RUNNER_TEMP/app-release.jks" \
            -deststoretype JKS \
            -deststorepass 'chatcell2026' \
            -destalias chatcell \
            -noprompt
          ls -lh "$RUNNER_TEMP/app-release.jks"

      - name: 打印构建环境（出问题先看这一步）
        run: |
          echo "=== java ==="
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "=== gradle ==="
          cd android && ./gradlew --version

      - name: 编译 Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/app-release.jks" \
            -Pandroid.injected.signing.store.password=chatcell2026 \
            -Pandroid.injected.signing.key.alias=chatcell \
            -Pandroid.injected.signing.key.password=chatcell2026

      - name: 整理产物
        run: |
          mkdir -p out
          ls -lh android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/ChatCell-r${{ github.run_number }}.apk"
          ls -lh out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatCell-apk-r${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # 只有推 v* tag 时才走这一步，把 APK 直接挂到 Releases 页面
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ChatCell ${{ github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
          body: |
            自动构建的 APK，下载后直接安装即可（覆盖安装不会丢失会话）。

            版本号见 App 内「设置」最底部。
