name: build-apk

# 什么时候触发：
#   1. 往 main / master 推送代码 —— 自动出一个 debug APK
#   2. 在 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: 构建前端（产出 dist/）
        run: npm run build

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android 命令行工具
        uses: android-actions/setup-android@v3

      - name: 补齐 Android SDK 平台
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" > /dev/null 2>&1 || true
          sdkmanager --install "build-tools;35.0.0" > /dev/null 2>&1 || true
          sdkmanager --install "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "已安装的 SDK 组件:"
          sdkmanager --list_installed || true

      - name: 生成 Android 原生工程
        run: npx cap add android || true

      - name: 把 web 产物同步进原生工程
        run: npx cap sync android

      - name: 给 gradlew 加执行权限
        # Windows 上提交的仓库到 Linux 常丢可执行位，这一步不做会直接 Permission denied
        run: chmod +x android/gradlew

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 编译 Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/ChatCell-debug-r${{ github.run_number }}.apk"
          ls -lh out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatCell-debug-apk-r${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
